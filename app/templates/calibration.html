<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校准样本库 - short-video-agent</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body>
<header class="site-header compact-header">
    <div>
        <div class="eyebrow">Quality Calibration</div>
        <h1>校准样本库</h1>
        <p>查看已经沉淀的单条作品校准记录，比较 AI 自检、人工验收和下一步修正方向。</p>
    </div>
</header>

<main class="page calibration-page">
    <section class="case-toolbar">
        <a class="text-link" href="/">返回首页</a>
        <div class="toolbar-actions">
            <button type="button" id="copy-calibration-report-button">复制对比报告</button>
            <button type="button" id="download-calibration-report-button">下载对比报告</button>
            <button type="button" id="refresh-calibration-button">刷新样本</button>
        </div>
    </section>
    <div id="calibration-report-status" class="inline-result hidden"></div>

    <section class="result-card">
        <div class="section-heading-row">
            <div>
                <h2>筛选样本</h2>
                <p class="muted">按校准状态、人工结论、内容类型或关键词筛选，用于发现最需要修正的拆解样本。</p>
            </div>
        </div>
        <form id="calibration-filter-form" class="calibration-filter-form">
            <label>校准状态
                <select id="calibration-status-filter" name="status">
                    <option value="">全部</option>
                    <option value="needs_ai_analysis">等待 AI 拆解</option>
                    <option value="awaiting_review">等待人工验收</option>
                    <option value="needs_rerun">需要重跑</option>
                    <option value="accepted">验收通过</option>
                    <option value="calibrating">校准中</option>
                </select>
            </label>
            <label>诊断状态
                <select id="calibration-diagnosis-status-filter" name="diagnosis_status">
                    <option value="">全部</option>
                    <option value="needs_ai_analysis">等待 AI 拆解</option>
                    <option value="needs_rerun">需要带反馈重跑</option>
                    <option value="enrichment_mismatch">富化证据未对齐</option>
                    <option value="needs_context">证据不完整</option>
                    <option value="accepted">可沉淀</option>
                    <option value="reviewable">可人工复核</option>
                    <option value="needs_review">需要补齐</option>
                </select>
            </label>
            <label>人工结论
                <select id="calibration-verdict-filter" name="verdict">
                    <option value="">全部</option>
                    <option value="pending">待验收</option>
                    <option value="pass">通过</option>
                    <option value="needs_fix">需要修正</option>
                    <option value="reject">不通过</option>
                </select>
            </label>
            <label>内容类型
                <input id="calibration-category-filter" name="category" placeholder="例如 tutorial / 教学">
            </label>
            <label>关键词
                <input id="calibration-search-filter" name="search" placeholder="标题、作者、case_id、验收意见">
            </label>
            <button type="submit">应用筛选</button>
        </form>
    </section>

    <section class="result-card">
        <div class="section-heading-row">
            <div>
                <h2>样本概览</h2>
                <p id="calibration-updated-at" class="muted"></p>
            </div>
        </div>
        <div id="calibration-summary" class="calibration-summary-grid"></div>
    </section>

    <section class="result-card">
        <div class="section-heading-row">
            <div>
                <h2>常见质量问题</h2>
                <p class="muted">根据当前筛选样本聚合 AI 自检缺口、人工阻塞项、准备度缺口和下一步动作。</p>
            </div>
        </div>
        <div id="calibration-insights" class="calibration-insights-grid"></div>
    </section>

    <section class="result-card">
        <div class="section-heading-row">
            <div>
                <h2>规则改进建议</h2>
                <p class="muted">把常见质量问题翻译成可执行的 prompt、质量闸门或富化流程改进。</p>
            </div>
        </div>
        <div id="calibration-recommendations" class="calibration-recommendation-list"></div>
    </section>

    <section class="result-card">
        <div class="section-heading-row">
            <div>
                <h2>校准记录</h2>
                <p class="muted">每条记录来自 case 页面保存的 <code>quality_calibration_record.json</code>。</p>
            </div>
        </div>
        <div id="calibration-records" class="calibration-record-list"></div>
    </section>
</main>

<script src="/static/calibration.js?v={{ static_version }}"></script>
</body>
</html>
